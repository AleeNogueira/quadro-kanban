<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar na Sala</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0a192f, #1e3a8a); height: 100vh; display: flex; justify-content: center; align-items: center; color: #f8fafc; }
        .container { background-color: #0f172a; padding: 40px 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); width: 100%; max-width: 400px; border: 1px solid #1e293b; }
        h2 { text-align: center; margin-bottom: 24px; color: #38bdf8; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
        input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background-color: #1e293b; color: #f8fafc; font-size: 15px; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: #38bdf8; }
        .btn { width: 100%; padding: 12px; background-color: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.3s; margin-top: 10px; }
        .btn:hover { background-color: #1d4ed8; }
        .footer-link { text-align: center; margin-top: 20px; font-size: 14px; color: #94a3b8; }
        .footer-link a { color: #38bdf8; text-decoration: none; font-weight: 500; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>Entrar na conta</h2>
    <form id="formLogin" action="/api/LoginUser" method="POST">
        <div class="form-group">
            <label for="email">Email *</label>
            <input type="text" id="email" name="email" placeholder="seuemail@teste.com" required>
        </div>

        <button type="submit" class="btn">Entrar</button>
    </form>

    <div class="footer-link">
        <p>Não tem conta? <a href="/">Clique aqui</a></p>
    </div>
</div>

<script>
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;

        try {
            const response = await fetch('/api/LoginUser', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email })
            });

            const resultado = await response.json();

            if (resultado.sucesso) {
                // Guarda os dados do usuário logado no navegador para usar depois
                localStorage.setItem('usuarioLogado', JSON.stringify(resultado.usuario));

                window.location.href = '/JoinRoom';
            } else {
                alert(resultado.erro);
            }
        } catch (error) {
            console.error('Erro na autenticação:', error);
        }
    });
</script>
</body>
</html>
