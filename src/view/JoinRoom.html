<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar na Sala</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0a192f, #1e3a8a); height: 100vh; display: flex; justify-content: center; align-items: center; color: #f8fafc; }
        .container { background-color: #0f172a; padding: 40px 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); width: 100%; max-width: 400px; border: 1px solid #1e293b; }
        h2 { text-align: center; margin-bottom: 24px; color: #38bdf8; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
        input { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background-color: #1e293b; color: #f8fafc; font-size: 15px; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: #38bdf8; }
        .btn { width: 100%; padding: 12px; background-color: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.3s; margin-top: 10px; }
        .btn:hover { background-color: #1d4ed8; }
        .footer-link { text-align: center; margin-top: 20px; font-size: 14px; color: #94a3b8; }
        .footer-link a { color: #38bdf8; text-decoration: none; font-weight: 500; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>Entrar na Sala</h2>
    <form id="formJoinRoom" action="/api/JoinRoom" method="POST">
        <div class="form-group">
            <label for="codigo">Código da Sala *</label>
            <input type="TEXT" id="codigo" name="codigo" placeholder="Ex: 123456" required>
        </div>

        <button type="submit" class="btn">Entrar na Sala</button>
    </form>

    <div class="footer-link">
        <p>Criar nova sala? <a href="/CreateRoom">Clique aqui</a></p>
    </div>
</div>

<script>
    document.getElementById('formJoinRoom').addEventListener('submit', async (e) => {
        e.preventDefault();

        const codigo = document.getElementById('codigo').value.trim();
        // Obtém o usuário armazenado durante o login/cadastro
        const usuarioStorage = localStorage.getItem('usuarioLogado');
        const usuarioLogado = usuarioStorage ? JSON.parse(usuarioStorage) : null;
        const id_usuario = usuarioLogado?.id_usuario || usuarioLogado?.id;

        if (!id_usuario) {
            alert('Sessão expirada ou usuário não identificado. Por favor, faça login novamente.');
            window.location.href = '/LoginIn';
            return;
        }

        try {
            const response = await fetch('/api/JoinRoom', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ codigo, id_usuario })
            });

            const resultado = await response.json();

            if (resultado.sucesso) {
                // Guarda os dados da sala logada para usar na conexão via WebSocket depois
                localStorage.setItem('salaAtiva', JSON.stringify(resultado.quadro || { codigo }));

                window.location.href = '/Home';
            } else {
                alert(resultado.erro);
            }
        } catch (error) {
            console.error('Erro ao validar sala:', error);
            alert('Falha ao conectar com o servidor.');
        }
    });
</script>
</body>
</html>
