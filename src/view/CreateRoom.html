<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Nova Sala</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0a192f, #1e3a8a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #f8fafc;
        }

        .container {
            background-color: #0f172a;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid #1e293b;
        }

        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #38bdf8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #f8fafc;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        input:focus, textarea:focus {
            border-color: #38bdf8;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #059669;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background-color: #047857;
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #94a3b8;
        }

        .footer-link a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Criar Nova Sala</h2>
    <form action="/api/CreateRoom" method="POST">
        <div class="form-group">
            <label for="codigo_sala">Código da Sala *</label>
            <input type="text" id="codigo_sala" name="codigo_sala" placeholder="Defina um código" required>
        </div>

        <div class="form-group">
            <label for="nome_sala">Nome da Sala *</label>
            <input type="text" id="nome_sala" name="nome_sala" placeholder="Nome da sua sala" required>
        </div>

        <div class="form-group">
            <label for="descricao">Descrição (opcional)</label>
            <textarea id="descricao" name="descricao" placeholder="Sobre o que é esta sala?"></textarea>
        </div>

        <button type="submit" class="btn">Criar Sala</button>
    </form>

    <div class="footer-link">
        <p>Já tem uma sala? <a href="/">Voltar para Login</a></p>
    </div>
</div>

</body>
</html>
